<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Product Comparison Advisor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══ Trang bắt đầu ═══ -->
<div id="landing" class="landing">
  <h1>AI Product Comparison Advisor</h1>
  <p class="sub">Trợ lý AI tư vấn và so sánh sản phẩm điện máy</p>
  <button class="btn primary" onclick="startChat(null)">Bắt đầu tư vấn</button>
  <div class="demo-accounts">
    <p>Tài khoản demo:</p>
    <button class="btn" onclick="startChat('demo_001')">Khách A — đã hỏi máy lạnh</button>
    <button class="btn" onclick="startChat('demo_002')">Khách B — đã hỏi tủ lạnh</button>
    <button class="btn" onclick="startChat('new')">Khách mới — chưa có lịch sử</button>
  </div>
</div>

<!-- ═══ Màn hình Chat ═══ -->
<div id="chat-screen" class="chat-screen hidden">
  <header>
    <span>🛒 Trợ lý tư vấn điện máy</span>
    <span id="customer-badge" class="badge"></span>
  </header>
  <div id="messages" class="messages"></div>
  <div id="typing" class="typing hidden">AI đang xử lý…</div>
  <div class="input-row">
    <input id="msg-input" type="text"
           placeholder="Nhập nhu cầu của bạn, ví dụ: máy lạnh dưới 20 triệu cho phòng 18m²"
           onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="send-btn" class="btn primary" onclick="sendMessage()" disabled>Gửi</button>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/static/chat.js"></script>
</body>
</html>
